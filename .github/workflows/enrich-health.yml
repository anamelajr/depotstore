name: Enrich Health

# Fails (→ GitHub notification email) when the last 3 OpenAI-active enrich
# batches all recorded openai_succeeded = 0 — the 2026-07-14 silent-outage
# signature. The endpoint is read-only; every 6h is plenty since the alarm
# condition requires persistence anyway.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /api/health/enrich
        env:
          HEALTH_URL: ${{ vars.ENRICH_HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "ENRICH_HEALTH_URL variable or CRON_SECRET secret is not set" >&2
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o /tmp/health.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$HEALTH_URL")
          echo "HTTP $status"
          cat /tmp/health.json; echo
          [ "$status" = "200" ]
          jq -e '.stale != true' /tmp/health.json >/dev/null \
            || echo "::warning::no OpenAI-active enrich rows in the lookback window"
          jq -e '.alarm == false' /tmp/health.json >/dev/null
